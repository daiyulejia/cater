[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "cater"
version = "0.1.0"
description = "Autonomous multi-agent collaboration runtime"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
cater = "cater.cli:main"

[tool.setuptools.packages.find]
include = ["cater*"]

[tool.setuptools.package-data]
cater = ["packs/*.json", "packs/*.md", "packs/skills/*.json", "packs/skills/*.md", "static/workroom/*", "static/workroom/assets/*"]
