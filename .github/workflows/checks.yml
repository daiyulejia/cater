name: Runtime checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-check:
    name: Optional browser executor
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/browser-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned browser tool
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npm run install:browser
      - name: Verify real browser boundaries and assertions
        run: npm test

  runtime:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run standard-library test suite
        run: python scripts/check.py
      - name: Check whitespace
        run: git diff --check

  workroom:
    name: Conversation UI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned package manager
        run: npm install --global pnpm@11.25.0
      - name: Install frontend development dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned UI browser regression runtime
        working-directory: tools/browser-check
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium and Linux browser dependencies
        working-directory: tools/browser-check
        run: npx --no-install playwright install --with-deps chromium
      - name: Check conversation interactions
        env:
          CATER_WEB_BROWSER_TESTS: '1'
        run: pnpm exec vitest run --maxWorkers=2
      - name: Lint and build workroom
        run: |
          pnpm lint
          pnpm build
