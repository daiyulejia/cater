name: Runtime checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcp-stdio:
    name: Optional MCP stdio / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install pinned optional MCP bridge
        working-directory: tools/mcp-bridge
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check SDK lifecycle and transport boundaries
        working-directory: tools/mcp-bridge
        run: npm test
      - name: Check native tools with an actual local SDK service
        env:
          CATER_MCP_SDK_TESTS: '1'
        run: python -m unittest discover -s tests -p test_mcp_sdk.py

  browser-check:
    name: Optional browser executor
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/browser-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned browser tool
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npm run install:browser
      - name: Verify real browser boundaries and assertions
        run: npm test
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Verify published project archives through native tools
        working-directory: .
        env:
          CATER_ARCHIVE_BROWSER_TESTS: '1'
        run: python -m unittest discover -s tests -p test_archive_browser_cycle.py

  runtime:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.selection }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
            selection: full
            args: ''
          - os: ubuntu-latest
            python: '3.13'
            selection: full
            args: ''
          - os: windows-latest
            python: '3.11'
            selection: shard-1-of-2
            args: '--shard 1/2'
          - os: windows-latest
            python: '3.11'
            selection: shard-2-of-2
            args: '--shard 2/2'
          - os: windows-latest
            python: '3.13'
            selection: shard-1-of-2
            args: '--shard 1/2'
          - os: windows-latest
            python: '3.13'
            selection: shard-2-of-2
            args: '--shard 2/2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run standard-library test suite
        run: python scripts/check.py ${{ matrix.args }}
      - name: Check whitespace
        run: git diff --check

  package:
    name: Installed package / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare development build tools
        run: python -m pip install "setuptools>=77.0.3"
      - name: Build and verify a clean installed package without model calls
        run: python scripts/build_release.py
      - name: Show retained package receipts on failure
        if: failure()
        shell: python
        run: |
          from pathlib import Path
          import sys
          sys.stdout.reconfigure(encoding="utf-8", errors="backslashreplace")
          for name in ("release", "toolchain", "build", "install", "smoke"):
              for path in sorted(Path("dist/releases").glob(f"*/{name}.json")):
                  print(f"--- {path.as_posix()} ---")
                  print(path.read_text(encoding="utf-8")[:20000])

  workroom:
    name: Conversation UI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned package manager
        run: npm install --global pnpm@11.25.0
      - name: Install frontend development dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned UI browser regression runtime
        working-directory: tools/browser-check
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium and Linux browser dependencies
        working-directory: tools/browser-check
        run: npx --no-install playwright install --with-deps chromium
      - name: Check conversation interactions
        env:
          CATER_WEB_BROWSER_TESTS: '1'
        run: pnpm exec vitest run --maxWorkers=2
      - name: Lint and build workroom
        run: |
          pnpm lint
          pnpm build
